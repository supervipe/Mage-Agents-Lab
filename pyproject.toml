[project]
name = "goblin-agents-lab"
version = "0.1.0"
description = "A from-scratch Python AI agent learning lab."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2025.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
app = ["static/*.html"]
